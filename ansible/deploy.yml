---
- name: Deploy the URL shortener
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    app_namespace: url-shortener
    ingress_host: shortener.test
    ingress_class: nginx
    kube: ["kubectl", "--context", "{{ kube_context }}"]
    namespaced: "{{ kube + ['--namespace', app_namespace] }}"
    manifest_dir: "{{ playbook_dir }}/../k8s"
  tasks:
    - name: Require the target context and application image
      ansible.builtin.assert:
        that:
          - kube_context is defined and kube_context | length > 0
          - app_image is defined and app_image | length > 0
        fail_msg: Pass kube_context and app_image using --extra-vars.
      tags: always

    - name: Ensure the application namespace exists
      ansible.builtin.command:
        argv: "{{ kube + ['apply', '-f', '-'] }}"
        stdin: "{{ {'apiVersion': 'v1', 'kind': 'Namespace', 'metadata': {'name': app_namespace}} | to_json }}"
      register: ns_apply
      changed_when: "'unchanged' not in ns_apply.stdout"

    - name: Check for an existing database credential
      ansible.builtin.command:
        argv: "{{ namespaced + ['get', 'secret', 'shortener-db', '--ignore-not-found', '-o', 'name'] }}"
      register: db_secret
      changed_when: false

    - name: Initialize a password once for the persistent database
      ansible.builtin.command:
        argv: "{{ namespaced + ['create', '-f', '-'] }}"
        stdin: >-
          {{ {'apiVersion': 'v1', 'kind': 'Secret',
              'metadata': {'name': 'shortener-db'},
              'stringData': {'password': lookup('ansible.builtin.password', '/dev/null',
                                               length=40, chars=['ascii_letters', 'digits'])}} | to_json }}
      when: db_secret.stdout | length == 0
      no_log: true

    - name: Apply the database, services, API, autoscaler and ingress
      ansible.builtin.command:
        argv: "{{ namespaced + ['apply', '-f', '-'] }}"
        stdin: "{{ lookup('ansible.builtin.template', manifest_dir + '/' + item) }}"
      loop:
        - database.yaml
        - api.yaml.j2
      register: applied
      changed_when: "'created' in applied.stdout or 'configured' in applied.stdout"

    - name: Wait for database and API deployments to become ready
      ansible.builtin.command:
        argv: "{{ namespaced + ['rollout', 'status', 'deployment/' + item, '--timeout=5m'] }}"
      loop:
        - shortener-db
        - shortener-api
      changed_when: false
      tags: rollout
