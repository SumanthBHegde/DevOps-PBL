services:
  app:
    build: .
    ports:
      - "127.0.0.1:${APP_PORT:-8000}:8000"
    environment:
      DATABASE_URL: postgresql://shortener@db:5432/shortener
      PGPASSWORD: ${POSTGRES_PASSWORD:-shortener-local}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=4)"]
      interval: 5s
      timeout: 5s
      retries: 10
  db:
    image: postgres:17-bookworm
    environment:
      POSTGRES_USER: shortener
      POSTGRES_DB: shortener
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-shortener-local}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shortener -d shortener"]
      interval: 3s
      timeout: 3s
      retries: 15
volumes:
  pgdata:
